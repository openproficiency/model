name: Publish package

on:
  push:
    branches:
      - main
    paths:
      - "schemas/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package-version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Read package version
        id: package-version
        run: echo "value=$(npm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Pack package
        run: npm pack --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Publish package
        run: npm publish ./package/*.tgz --provenance

      - name: Create GitHub release
        run: >
          gh release create "v${PACKAGE_VERSION}" ./package/*.tgz
          --generate-notes
          --target "${GITHUB_SHA}"
          --title "v${PACKAGE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
