name: Validate package

on:
  pull_request:
    branches:
      - main
    paths:
      - "schemas/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package-version.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Set package version
        id: package-version
        run: |
          PACKAGE_VERSION="$(npm pkg get version | tr -d '"')-pr-${PR_NUMBER}-${COMMIT_SHA}"
          npm version "$PACKAGE_VERSION" --no-git-tag-version
          echo "artifact_name=openproficiency-schema-$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Pack package
        run: npm pack --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-version.outputs.artifact_name }}
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7

      - name: Comment package download instructions
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: temporary-package
          message: |
            The temporary package build is ready (7 day retention):

            ```bash
            gh run download --name '${{ steps.package-version.outputs.artifact_name }}'
            ```

  dry-run-publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: package

      - name: Dry-run package publish
        run: npm publish ./package/*.tgz --dry-run --tag pr
